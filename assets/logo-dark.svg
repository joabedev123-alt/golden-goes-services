<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" role="img" aria-labelledby="logoDarkTitle logoDarkDesc">
  <title id="logoDarkTitle">Golden Goes Services LLC</title>
  <desc id="logoDarkDesc">Golden G monogram with roof and sparkle beside the Golden Goes wordmark for dark navy backgrounds</desc>
  <defs>
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DF96"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A67C1E"/>
    </linearGradient>
  </defs>
  <g transform="translate(2,2)">
    <circle cx="30" cy="30" r="28" fill="none" stroke="url(#goldDark)" stroke-width="1.5" opacity="0.7"/>
    <!-- G outer arc -->
    <path fill="url(#goldDark)" d="M31 11c-10.5 0-19 8.5-19 19s8.5 19 19 19c6.8 0 12.8-3.6 16.1-9l-4.6-2.9c-2.3 3.7-6.5 6.2-11.5 6.2-7.4 0-13.4-6-13.4-13.4S23.6 16.5 31 16.5c4.1 0 7.8 1.9 10.3 4.8l4.2-3.7C41.9 13.5 36.7 11 31 11z"/>
    <!-- G horizontal bar -->
    <path fill="url(#goldDark)" d="M30 31h15v5.5h-5.5V43H34v-6.5h-4z"/>
    <!-- Roof + window inside G -->
    <path fill="none" stroke="url(#goldDark)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M23 28.5l8-6.5 8 6.5"/>
    <rect x="28.6" y="26.5" width="2" height="2" fill="#F5DF96"/>
    <rect x="31.4" y="26.5" width="2" height="2" fill="#F5DF96"/>
    <!-- Sparkle -->
    <path d="M49 9l1.3 3 3 1.3-3 1.3-1.3 3-1.3-3-3-1.3 3-1.3z" fill="#F5DF96"/>
  </g>
  <text x="72" y="31" font-family="'DM Serif Text', Georgia, 'Times New Roman', serif" font-size="26" fill="url(#goldDark)">Golden Goes</text>
  <text x="74" y="50" font-family="'DM Sans', Arial, Helvetica, sans-serif" font-size="11" letter-spacing="2.4" fill="#F5F7FA">SERVICES LLC</text>
</svg>
